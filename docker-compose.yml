services:
  webshell:
    build: .
    ports:
      - "127.0.0.1:4767:4767"
    environment:
      HOST: 0.0.0.0
      PORT: 4767
      WEBSHELL_USERNAME: admin
      WEBSHELL_PASSWORD: change-me
      WEBSHELL_DATA_DIR: /data
      WEBSHELL_OUTPUT_FLUSH_MS: 4
    volumes:
      - webshell-data:/data
    restart: unless-stopped

volumes:
  webshell-data:
